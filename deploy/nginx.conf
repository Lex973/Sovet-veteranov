# Nginx для советветеранов74.рф
# Разместить: /etc/nginx/sites-available/sovet-veteranov (или в conf.d)
# Включить: ln -s /etc/nginx/sites-available/sovet-veteranov /etc/nginx/sites-enabled/
# Проверка: nginx -t && systemctl reload nginx

## HTTP → HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name советветеранов74.рф xn--74-6kchabsba5fehxhsc.xn--p1ai 90.156.227.169;

    return 301 https://$host$request_uri;
}

## Основной сервер с HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name советветеранов74.рф xn--74-6kchabsba5fehxhsc.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--74-6kchabsba5fehxhsc.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--74-6kchabsba5fehxhsc.xn--p1ai/privkey.pem;

    root /opt/sovet-veteranov/frontend;
    index index.html;

    # Лимит размера загружаемых файлов (фото из админки, с телефона часто > 1 МБ)
    client_max_body_size 20M;

    # Логи
    access_log /var/log/nginx/sovet-veteranov-access.log;
    error_log  /var/log/nginx/sovet-veteranov-error.log;

    # API и медиа — проксируем на FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000/media/;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # SPA: все остальные запросы — index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
